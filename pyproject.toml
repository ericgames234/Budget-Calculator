[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-manager"
version = "1.0.0"
description = "Personal budget manager: validated transactions, filters and per-currency summaries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
budget = "budget_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
